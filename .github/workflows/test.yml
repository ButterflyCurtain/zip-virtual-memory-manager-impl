# テスト専用 CI。
#
# ローカルの Rust ツールチェーンが失われた（CARGO_HOME/RUSTUP_HOME が D: を指したまま
# ドライブごと消えた）ため、`cargo test` を回せる唯一の場所がここになる。目的は
# 「205 テスト緑・警告なし」を常時確認できる状態を保つこと。
#
# キャッシュについて: GitHub Actions のキャッシュは **7 日間参照が無いと evict** され、
# リポジトリ全体で 10 GB を超えても古いものから落ちる。作業が空いても消えないよう、
# 週 1 の schedule で空回しして温存する（`Swatinem/rust-cache` がキーを回す）。
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # 毎週月曜 03:00 UTC。キャッシュの 7 日 evict を回避するためのウォームアップ。
    - cron: "0 3 * * 1"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows が本来の開発環境（inode=0 / seek_read などの cfg 分岐が効く側）。
        # Linux は Unix 側の分岐（pread / 親 dir fsync）を初めて踏む経路なので、
        # 落ちたらそれ自体が情報。
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc -vV
          cargo -vV

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # OS ごとに分ける。ジョブ名を混ぜないことでブランチ間でも共有される。
          shared-key: test-${{ matrix.os }}

      - name: cargo test
        run: cargo test --locked

      # このクレートのテストは全て自前の parser を通るので、「自分が書いたものを
      # 自分で読める」ことしか言えない。設計が約束しているのは「普通の展開ソフトで
      # 開ける」こと。cargo test が target/zip-compat/ へ吐いた実 commit 出力を、
      # 第三者の実装（Python の zipfile）で開いて全メンバを読み出す。
      - name: third-party ZIP compatibility
        shell: python
        run: |
          import pathlib, sys, zipfile

          out = pathlib.Path("target/zip-compat")
          zips = sorted(out.glob("*.zip"))
          if not zips:
              sys.exit("no fixtures in target/zip-compat - did the test run?")

          failed = False
          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  bad = zf.testzip()
                  if bad is not None:
                      print(f"{z.name}: first bad member reported by testzip(): {bad}")
                      failed = True
                      continue
                  for info in zf.infolist():
                      data = zf.read(info.filename)
                      if len(data) != info.file_size:
                          print(f"{z.name}: {info.filename} short read")
                          failed = True
                  print(f"{z.name}: OK - {len(zf.infolist())} entries, "
                        f"names={[i.filename for i in zf.infolist()]}")
                  for info in zf.infolist():
                      print(f"    {info.filename}: date_time={info.date_time} "
                            f"external_attr={info.external_attr:#o} "
                            f"comment={info.comment!r} extra={len(info.extra)}B")
          sys.exit(1 if failed else 0)

  # clippy はブロッキング（ADR 0015 A-5 で既存指摘 28 件を解消済み）。
  # rustc の「警告なし」基準（HANDOFF）と揃えて、以降の劣化をここで止める。
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-ubuntu-latest

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
